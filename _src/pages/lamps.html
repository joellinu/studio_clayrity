<!-- page: {"title":"Lamps — Studio Clayrity","description":"Hand-pierced, carved and glazed ceramic lamps that throw patterns of light. Order on WhatsApp.","nav":"lamps","explore":"lamps"} -->
    <!-- Lamps: an after-dark room where each lamp switches on -->
    <section class="lamps lamps--page" id="lamps">
      <div class="wrap">
        <div class="lamps__head">
          <div>
            <p class="eyebrow eyebrow--light">After dark</p>
            <h1>Lamps that throw patterns</h1>
            <p class="lamps__lead">Pierced, carved and glazed by hand. Switch one on and the whole room fills with light and shadow.</p>
          </div>
          <button class="switch" id="light-switch" type="button" aria-pressed="true">
            <span class="switch__track"><span class="switch__knob"></span></span>
            <span class="switch__label">Lights on</span>
          </button>
        </div>
        <div class="lamps__grid" id="lamp-grid"></div>
      </div>
    </section>

    <!-- Keep exploring: the other collections -->
    <section class="explore explore--more wrap" aria-label="Keep exploring">
      <div class="section-head"><h2>Keep exploring</h2></div>
      {{explore}}
    </section>
